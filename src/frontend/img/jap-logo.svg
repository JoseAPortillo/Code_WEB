<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="JAP - Jose A Portillo - Website">
    <defs>
        <linearGradient id="chip-body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0a0f0b"/>
            <stop offset="1" stop-color="#0d1410"/>
        </linearGradient>
        <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="3.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- outward circuit traces -->
    <g fill="none" stroke="#52a8ce" stroke-width="1.6" opacity="0.55">
        <path d="M130 82 v-16 h-24 v-12 h-14"/>
        <path d="M194 82 v-24 h-14"/>
        <path d="M258 82 v-16 h28 v-10 h18"/>
        <path d="M102 140 h-26 v-18 h-22"/>
        <path d="M298 140 h26 v-22 h24"/>
        <path d="M130 218 v16 h-30 v10 h-20"/>
        <path d="M194 218 v22 h12"/>
        <path d="M258 218 v18 h34 v8 h22"/>
    </g>

    <!-- via terminals -->
    <g fill="#52a8ce">
        <circle cx="106" cy="54" r="3.2"/>
        <circle cx="180" cy="58" r="3.2"/>
        <circle cx="304" cy="56" r="3.2"/>
        <circle cx="54" cy="122" r="3.2"/>
        <circle cx="348" cy="118" r="3.2"/>
        <circle cx="80" cy="244" r="3.2"/>
        <circle cx="206" cy="240" r="3.2"/>
        <circle cx="314" cy="244" r="3.2"/>
    </g>

    <!-- corner LEDs -->
    <g fill="#ffb347">
        <circle cx="122" cy="102" r="3.4"/>
        <circle cx="278" cy="102" r="3.4"/>
        <circle cx="122" cy="198" r="3.4"/>
        <circle cx="278" cy="198" r="3.4"/>
    </g>

    <!-- pads -->
    <g fill="#7f9fb8" opacity="0.7">
        <rect x="130" y="82" width="14" height="8"/>
        <rect x="162" y="82" width="14" height="8"/>
        <rect x="194" y="82" width="14" height="8"/>
        <rect x="226" y="82" width="14" height="8"/>
        <rect x="258" y="82" width="14" height="8"/>
        <rect x="130" y="210" width="14" height="8"/>
        <rect x="162" y="210" width="14" height="8"/>
        <rect x="194" y="210" width="14" height="8"/>
        <rect x="226" y="210" width="14" height="8"/>
        <rect x="258" y="210" width="14" height="8"/>
        <rect x="102" y="112" width="8" height="14"/>
        <rect x="102" y="137" width="8" height="14"/>
        <rect x="102" y="162" width="8" height="14"/>
        <rect x="102" y="187" width="8" height="14"/>
        <rect x="290" y="112" width="8" height="14"/>
        <rect x="290" y="137" width="8" height="14"/>
        <rect x="290" y="162" width="8" height="14"/>
        <rect x="290" y="187" width="8" height="14"/>
    </g>

    <!-- chip body -->
    <g filter="url(#neon)">
        <rect x="110" y="90" width="180" height="120" rx="8" fill="url(#chip-body)" stroke="#52a8ce" stroke-width="1.5"/>
    </g>
    <rect x="117" y="97" width="166" height="106" rx="4" fill="none" stroke="#243840" stroke-width="1"/>

    <!-- inner traces -->
    <g fill="none" stroke="#52a8ce" stroke-width="1" opacity="0.4">
        <path d="M130 150 h12 v-14 h10"/>
        <path d="M286 152 h-8 v-10 h-16"/>
        <path d="M132 186 h10 v-8 h12"/>
        <path d="M268 186 h-12 v10 h-12"/>
    </g>

    <!-- chip text -->
    <text x="200" y="118" text-anchor="middle" font-family="VT323, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#c3ced3">JOSE A PORTILLO</text>
    <line x1="145" y1="128" x2="255" y2="128" stroke="#243840" stroke-width="1"/>
    <g filter="url(#neon)">
        <text x="200" y="176" text-anchor="middle" font-family="VT323, 'Courier New', monospace" font-size="58" font-weight="bold" fill="#52a8ce">JAP</text>
    </g>
    <text x="200" y="198" text-anchor="middle" font-family="VT323, 'Courier New', monospace" font-size="13" letter-spacing="5" fill="#c3ced3">WEBSITE</text>
</svg>
