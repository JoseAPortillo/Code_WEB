<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="JAP">
    <defs>
        <linearGradient id="mark-body" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0c1210"/>
            <stop offset="1" stop-color="#101812"/>
        </linearGradient>
        <filter id="mark-neon" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- outward traces (few, bold) -->
    <g fill="none" stroke="#52a8ce" stroke-width="2" opacity="0.65">
        <path d="M62 30 v-12 h-16"/>
        <path d="M98 30 v-14"/>
        <path d="M130 52 h10"/>
        <path d="M130 68 h10"/>
        <path d="M62 90 v10 h-12"/>
        <path d="M98 90 v12"/>
    </g>
    <g fill="#52a8ce">
        <circle cx="46" cy="18" r="2.6"/>
        <circle cx="98" cy="16" r="2.6"/>
        <circle cx="140" cy="52" r="2.6"/>
        <circle cx="140" cy="68" r="2.6"/>
        <circle cx="50" cy="100" r="2.6"/>
        <circle cx="98" cy="102" r="2.6"/>
    </g>

    <!-- corner LEDs -->
    <g fill="#ffb347">
        <circle cx="36" cy="36" r="2.6"/>
        <circle cx="124" cy="36" r="2.6"/>
        <circle cx="36" cy="84" r="2.6"/>
        <circle cx="124" cy="84" r="2.6"/>
    </g>

    <!-- pads -->
    <g fill="#7f9fb8" opacity="0.8">
        <rect x="50" y="24" width="10" height="6"/>
        <rect x="72" y="24" width="10" height="6"/>
        <rect x="94" y="24" width="10" height="6"/>
        <rect x="50" y="90" width="10" height="6"/>
        <rect x="72" y="90" width="10" height="6"/>
        <rect x="94" y="90" width="10" height="6"/>
        <rect x="24" y="44" width="6" height="10"/>
        <rect x="24" y="66" width="6" height="10"/>
        <rect x="130" y="44" width="6" height="10"/>
        <rect x="130" y="66" width="6" height="10"/>
    </g>

    <!-- chip body -->
    <g filter="url(#mark-neon)">
        <rect x="30" y="30" width="100" height="60" rx="6" fill="url(#mark-body)" stroke="#52a8ce" stroke-width="2"/>
    </g>
    <rect x="37" y="37" width="86" height="46" rx="3" fill="none" stroke="#243840" stroke-width="1"/>

    <!-- inner trace -->
    <g fill="none" stroke="#52a8ce" stroke-width="1.2" opacity="0.5">
        <path d="M46 52 h14 v10 h10"/>
        <path d="M114 68 h-12 v-10 h-12"/>
    </g>

    <g filter="url(#mark-neon)">
        <text x="80" y="73" text-anchor="middle" font-family="VT323, 'Courier New', monospace" font-size="38" font-weight="bold" fill="#52a8ce">JAP</text>
    </g>
</svg>
